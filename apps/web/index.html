<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Solving Club client operations workspace for projects, tasks, documents, conversations, and billing." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#111111" />
    <title>SolvingClub CMS</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23ff4338'/%3E%3C/svg%3E" />
    <style>
      html,body,#root{min-height:100%;margin:0;background:#0d0d0d;color:#f1f1ef;font-family:Arial,sans-serif}
      .boot-loader{min-height:100vh;display:flex;align-items:center;justify-content:center;gap:15px;color:#aaa9a4}
      .boot-mark{position:relative;width:54px;height:54px;display:grid;place-items:center;border:1px solid #2b2b2b;border-radius:14px;background:#151515;color:#f1f1ef;font-size:17px;font-weight:700;letter-spacing:-.05em}
      .boot-mark b{color:#ff4338}.boot-mark i{position:absolute;inset:-1px;border:2px solid transparent;border-top-color:#ff4338;border-radius:14px;animation:boot-spin 1.1s linear infinite}
      .boot-copy{display:grid;gap:3px}.boot-copy strong{color:#f1f1ef;font-size:14px}.boot-copy span{font-size:12px}
      @keyframes boot-spin{to{transform:rotate(360deg)}}
      @media(prefers-reduced-motion:reduce){.boot-mark i{animation:none;border-color:#ff4338}}
    </style>
  </head>
  <body>
    <div id="root"><div class="boot-loader" role="status"><div class="boot-mark">SC<b>.</b><i aria-hidden="true"></i></div><div class="boot-copy"><strong>Preparing your workspace</strong><span>Connecting clients, delivery, and billing…</span></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
